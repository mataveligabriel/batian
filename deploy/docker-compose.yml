services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # coletor de NetFlow/IPFIX (UDP 2055) e sFlow (UDP 6343) — mesma imagem do backend
  flow:
    build: ../backend
    command: ["python", "flowd.py"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    restart: unless-stopped
    network_mode: host
    environment:
      BASTION_DOMAIN: ${BASTION_DOMAIN}
      BASTION_ALT: ${BASTION_ALT:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
