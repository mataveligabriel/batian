services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    network_mode: host
    env_file: .env
    # dados que sobrevivem à atualização: autorização do drive (rclone) e área de envio para a nuvem
    volumes:
      - bastion_data:/data
    depends_on:
      mongo:
        condition: service_healthy

  # coletor de NetFlow/IPFIX (UDP 2055) e sFlow (UDP 6343) — mesma imagem do backend
  flow:
    build: ../backend
    command: ["python", "flowd.py"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # mitigação de DDoS: BGP do Bastion anuncia o /32 atacado para as bordas (blackhole). Fica parado até
  # ser ligado em Flow → Mitigação. Sai do ar = as bordas retiram o blackhole sozinhas (sessão cai).
  bgp:
    build: ../backend
    command: ["python", "bgpd.py"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # opcional: VPNs cliente (FortiGate SSL, OpenVPN, PPTP, L2TP/IPsec) para jumps que só respondem por VPN.
  # Ative com COMPOSE_PROFILES=vpn no deploy/.env (o update.sh prepara o /dev/ppp e os módulos do kernel).
  vpn:
    build: ../backend
    command: ["python", "vpnd.py"]
    profiles: ["vpn"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
    # /dev/net/tun (OpenVPN): o serviço cria o nó dentro do container; aqui só a permissão de uso
    device_cgroup_rules:
      - "c 10:200 rwm"
    depends_on:
      mongo:
        condition: service_healthy

  # opcional: modelo de IA local e grátis para o assistente (docker compose --profile ollama up -d)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Área de Trabalho Remota (menu RDP): o guacd (Apache Guacamole) fala RDP; o backend conversa com ele em 127.0.0.1:4822.
  # Rede do servidor (host) para alcançar os encaminhamentos locais dos agentes; escuta SÓ em 127.0.0.1.
  guacd:
    image: ${GUACD_IMAGE:-guacamole/guacd:1.5.5}
    restart: unless-stopped
    network_mode: host
    command: ["sh", "-c", "exec $$(command -v guacd || echo /opt/guacamole/sbin/guacd) -b 127.0.0.1 -l 4822 -L info -f"]

  # opcional: Krill (NLnet Labs) — autoridade certificadora RPKI dos ASNs gerenciados. O BastiON é a tela (menu RPKI).
  # Ative com: sudo bash deploy/rpki-setup.sh. Escuta só em 127.0.0.1; as chaves ficam no volume krill_data.
  krill:
    image: ${KRILL_IMAGE:-nlnetlabs/krill:latest}
    profiles: ["rpki"]
    restart: unless-stopped
    environment:
      KRILL_ADMIN_TOKEN: ${KRILL_ADMIN_TOKEN:-}
      KRILL_FQDN: localhost:${KRILL_PORT:-3000}
      KRILL_LOG_LEVEL: warn
      TZ: UTC
    ports:
      - "127.0.0.1:${KRILL_PORT:-3000}:3000"
    volumes:
      - krill_data:/var/krill/data

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    restart: unless-stopped
    network_mode: host
    environment:
      BASTION_DOMAIN: ${BASTION_DOMAIN}
      BASTION_ALT: ${BASTION_ALT:-}
      # HTTPS opcional (microfone/voz, PWA): IP ou domínio — o entrypoint acrescenta ao Caddyfile
      BASTION_HTTPS_HOST: ${BASTION_HTTPS_HOST:-}
      BASTION_HTTPS_PORT: ${BASTION_HTTPS_PORT:-8443}
      WEB_PROXY_PORTS: ${WEB_PROXY_PORTS:-8090-8099}
      WEB_PROXY_TLS_OFFSET: ${WEB_PROXY_TLS_OFFSET:-400}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  bastion_data:
  krill_data:
  mongo_data:
  ollama_data:
  caddy_data:
  caddy_config:
