services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # coletor de NetFlow/IPFIX (UDP 2055) e sFlow (UDP 6343) — mesma imagem do backend
  flow:
    build: ../backend
    command: ["python", "flowd.py"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # mitigação de DDoS: BGP do Bastion anuncia o /32 atacado para as bordas (blackhole). Fica parado até
  # ser ligado em Flow → Mitigação. Sai do ar = as bordas retiram o blackhole sozinhas (sessão cai).
  bgp:
    build: ../backend
    command: ["python", "bgpd.py"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy

  # opcional: VPN SSL da Fortinet (openfortivpn) para jumps que só respondem por VPN.
  # Ative com COMPOSE_PROFILES=vpn no deploy/.env (o update.sh prepara o /dev/ppp).
  vpn:
    build: ../backend
    command: ["python", "vpnd.py"]
    profiles: ["vpn"]
    restart: unless-stopped
    network_mode: host
    env_file: .env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
    depends_on:
      mongo:
        condition: service_healthy

  # opcional: modelo de IA local e grátis para o assistente (docker compose --profile ollama up -d)
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  frontend:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${PUBLIC_URL}
    restart: unless-stopped
    network_mode: host
    environment:
      BASTION_DOMAIN: ${BASTION_DOMAIN}
      BASTION_ALT: ${BASTION_ALT:-}
      # HTTPS opcional (microfone/voz, PWA): IP ou domínio — o entrypoint acrescenta ao Caddyfile
      BASTION_HTTPS_HOST: ${BASTION_HTTPS_HOST:-}
      BASTION_HTTPS_PORT: ${BASTION_HTTPS_PORT:-8443}
      WEB_PROXY_PORTS: ${WEB_PROXY_PORTS:-8090-8099}
      WEB_PROXY_TLS_OFFSET: ${WEB_PROXY_TLS_OFFSET:-400}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  ollama_data:
  caddy_data:
  caddy_config:
